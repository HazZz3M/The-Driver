name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      id: gradle_build
      continue-on-error: true
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

    - name: Publish Step Summary
      if: always()
      run: |
        echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload APK Artifact
      if: steps.gradle_build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Fail If Build Failed
      if: steps.gradle_build.outcome != 'success'
      run: exit 1
