name: Build Android APK

on:
  push:
    branches: [ "main", "master", "fix/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Read app version from pubspec.yaml
      id: version
      run: |
        VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "App version: $VERSION"

    - name: Restore release signing key from secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> $GITHUB_ENV
          echo "Release signing key restored."
        elif [ "$IS_RELEASE_BRANCH" = "true" ]; then
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Refusing to publish a release signed with a different key (users could not update)."
          exit 1
        else
          echo "::warning::No signing secret: this branch build is signed with the debug key and cannot update installed releases."
        fi

    - name: Fix Line Endings and Permissions
      run: |
        if [ -f ./android/gradlew ]; then
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew
        fi

    - name: Install Flutter Dependencies
      run: |
        flutter --version
        flutter pub get

    - name: Static analysis
      run: flutter analyze --no-fatal-infos --no-fatal-warnings

    - name: Unit tests
      run: flutter test

    - name: Build Flutter Release APK
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -o pipefail
        if ! flutter build apk --release 2>&1 | tee build.log; then
          # Surface compiler/Gradle errors as public annotations (raw logs require sign-in).
          grep -E "^e: |error:|What went wrong|> |Lint found|FAILURE" build.log | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
        fi
        cp build/app/outputs/flutter-apk/app-release.apk The-Driver.apk
        sha256sum The-Driver.apk | awk '{print $1}' > The-Driver.apk.sha256
        ls -lh The-Driver.apk
        echo "SHA-256: $(cat The-Driver.apk.sha256)"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Driver-${{ steps.version.outputs.tag }}-APK
        path: |
          The-Driver.apk
          The-Driver.apk.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "The Driver ${{ steps.version.outputs.tag }}"
        body_path: RELEASE_NOTES.md
        files: |
          The-Driver.apk
          The-Driver.apk.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
