name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Permanent Signing Keystore
      run: |
        mkdir -p android/app/keystore
        if [ ! -f android/app/keystore/fixed-release.keystore ]; then
          keytool -genkey -v -keystore android/app/keystore/fixed-release.keystore -alias thedriver -keyalg RSA -keysize 2048 -validity 10000 -storepass thedriver123 -keypass thedriver123 -dname "CN=TheDriver, OU=Mobile, O=TheDriver, L=Cairo, ST=Cairo, C=EG"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/keystore/fixed-release.keystore
          git commit -m "chore: commit permanent signing keystore [skip ci]" || echo "Keystore already committed"
          git push || echo "Push skipped"
        fi

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk The-Driver.apk
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk
        ls -lh The-Driver.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@The-Driver.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click Here to Download The Driver APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.5.1
        name: "The Driver v1.5.1 - Auto-Accept, Expense Hub & Telematics UI"
        body: |
          ### The Driver v1.5.1 - Telematics & Automation Upgrade
          - **Auto-Accept & Automated Bidding Engine**: Configurable smart acceptance/bidding based on net profit, profit/km, pickup distance, and zone filters, with automated accessibility taps and safety debounce.
          - **Unified Vehicles & Expenses Hub**: Centralized active vehicle switching, consumption tracking, fuel refills, oil changes, and spare parts management.
          - **Interactive (!) Alert Badge on Addresses**: Visual badge on ride addresses indicating 1-tap fast categorization to Favorite or Blacklisted zones.
          - **Next-Gen Telematics Obsidian Design**: High-contrast, fatigue-free automotive cockpit palette with rounded squircle buttons and zero emojis.
          - **Seamless In-App Update Engine**: Signed with permanent keystore for conflict-free updates.
        files: |
          The-Driver.apk
          inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Driver-Debug-APK
        path: The-Driver.apk
