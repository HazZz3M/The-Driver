name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Rename APK
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk

    - name: Upload to Direct Public Download Link
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@inDrive-Assistant.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
        echo "### 📱 Direct APK Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click Here to Download inDrive Assistant APK]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct link: $DIRECT_URL"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: inDrive-Assistant.apk
