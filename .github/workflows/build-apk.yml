name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Ensure Permanent Signing Keystore
      run: |
        mkdir -p android/app/keystore
        if [ ! -f android/app/keystore/fixed-release.keystore ]; then
          keytool -genkey -v -keystore android/app/keystore/fixed-release.keystore -alias thedriver -keyalg RSA -keysize 2048 -validity 10000 -storepass thedriver123 -keypass thedriver123 -dname "CN=TheDriver, OU=Mobile, O=TheDriver, L=Cairo, ST=Cairo, C=EG"
        fi

    - name: Fix Line Endings and Permissions
      run: |
        if [ -f ./android/gradlew ]; then
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew
        fi

    - name: Install Flutter Dependencies
      run: |
        flutter --version
        flutter pub get

    - name: Build Flutter Debug APK
      run: |
        flutter --version
        echo "Building Flutter debug APK..."
        flutter build apk --debug --verbose --android-skip-build-dependency-validation > flutter_build.log 2>&1 || BUILD_EXIT=$?
        if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
          echo "### Flutter Build Failed (Exit code: ${BUILD_EXIT:-1})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 flutter_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== LAST 120 LINES OF LOG ==="
          tail -n 120 flutter_build.log
          exit 1
        fi
        cp build/app/outputs/flutter-apk/app-debug.apk The-Driver.apk
        cp build/app/outputs/flutter-apk/app-debug.apk inDrive-Assistant.apk
        ls -lh The-Driver.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@The-Driver.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click Here to Download The Driver APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.6.0
        name: "The Driver v1.6.0 - Converted to Flutter (Dart Engine & Cockpit UI)"
        body: |
          ### The Driver v1.6.0 - Full Flutter Transformation
          - **100% Flutter Codebase**: Completely migrated from Jetpack Compose to high-performance Flutter & Dart.
          - **Obsidian Dark & Neon Cockpit UI**: Fatigue-free driver display optimized for high-contrast day & night driving.
          - **Smart 10s Counter-Bidding Engine**: Mathematical floor, recommended sweet-spot, and surge margin analytics.
          - **Fleet Vehicles & Fuel/Oil Expenses Hub**: Automatic recalculation of fuel economy (L/100km) and operating wear & tear.
          - **Native Android Floating HUD & Accessibility Integration**: Foreground service with screen bounds OCR parsing.
        files: |
          The-Driver.apk
          inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Driver-Debug-APK
        path: The-Driver.apk
