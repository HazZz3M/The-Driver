name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk
        ls -lh inDrive-Assistant.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@inDrive-Assistant.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### 📱 Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[🚀 Click Here to Download inDrive Assistant APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.4.0
        name: "inDrive Assistant v1.4.0 - In-App Updates, Card-Attached Popups & Zone Filters"
        body: |
          ### inDrive Assistant v1.4.0 - Major Telematics Upgrade
          - **In-App Auto Update**: Check and install application updates directly from within the Settings screen with one click.
          - **Card-Attached Small Popups**: Each ride order card on screen receives its own dedicated small popup hint positioned directly over that card.
          - **Real-Time Screen Synchronization**: Popups automatically sync with on-screen orders and instantly disappear as soon as orders expire, are accepted, or leave view.
          - **Compact Clutter-Free Design**: Customer names removed from popup hints to focus strictly on fair price, profitability, and operational advice.
          - **Geographic Zone Intelligence**:
            - Favorite Zones (e.g., Maadi, Tagamoa) highlighted in Gold with instant acceptance advice.
            - Blacklisted Zones (e.g., Helwan, Shubra El Kheima) marked with warning and accepted only if pricing is exceptionally high.
          - **Zero Emoji Standard**: Automotive telematics UI standard throughout the application.

          Download the attached `inDrive-Assistant.apk` to install on your Android device.
        files: inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: inDrive-Assistant.apk
