name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk
        ls -lh inDrive-Assistant.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@inDrive-Assistant.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### 📱 Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[🚀 Click Here to Download inDrive Assistant APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.2.0
        name: "inDrive Assistant v1.2.0 (Multi-Rides & Stability Fix)"
        body: |
          ### 🚗 مساعد كابتن إن درايف (inDrive Assistant) v1.2.0
          - 🛑 **حل مشكلة تكرار الاهتزاز نهائياً**: منع التكرار اللانهائي للاهتزاز + زر كتم/تشغيل الاهتزاز بنقرة واحدة.
          - ✕ **حل مشكلة إغلاق الزر العائم**: إمكانية تصغير وإغلاق النافذة العائمة بسهولة وسلاسة في أي وقت.
          - 👥 **دعم قراءة عروض متعددة للعملاء (Multi-Rides Queue)**: عرض أسماء العملاء وعروضهم المتتالية (رحلة فلان ورحلة فلان) مع إمكانية التبديل بينهم بضغطة زر.
          
          **التحميل المباشر:** حمل ملف `inDrive-Assistant.apk` المرفق بالأسفل وثبته على هاتفك مباشرة.
        files: inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: inDrive-Assistant.apk
