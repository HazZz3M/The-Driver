name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk
        ls -lh inDrive-Assistant.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@inDrive-Assistant.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### 📱 Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[🚀 Click Here to Download inDrive Assistant APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.3.0
        name: "inDrive Assistant v1.3.0 - Professional OEM HUD & Fair Price Engine"
        body: |
          ### inDrive Assistant v1.3.0 - Professional Telematics Release
          - **Contextual Popup Hint HUD**: Real-time floating overlay styled as an intelligent popup hint with dynamic acceptance color codes (Green = High Profit / Fair, Amber = Counter-bid, Red = Reject).
          - **Fair Price Recommendation**: Directly presents the fair, calculated operational price for each order based on vehicle consumption and maintenance overhead.
          - **Multi-Order Segmented Queue**: Smooth customer-by-customer order switching without UI flicker.
          - **Zero Emoji Interface**: Engineered to OEM automotive telematics standard with clean, high-contrast Material icons and fluid interactions.
          - **Optimized Haptics & Controls**: Multi-ride debounce, quick minimize/expand, and mute control.

          Download the attached `inDrive-Assistant.apk` to install on your Android device.
        files: inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: inDrive-Assistant.apk
