name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Line Endings and Permissions for Gradlew
      run: |
        sed -i 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk inDrive-Assistant.apk
        ls -lh inDrive-Assistant.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@inDrive-Assistant.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### 📱 Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[🚀 Click Here to Download inDrive Assistant APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.1.0
        name: "inDrive Assistant v1.1.0 (Auto Screen Reader)"
        body: |
          ### 🚗 مساعد كابتن إن درايف (inDrive Assistant) v1.1.0
          - ⚡ **خاصية قراءة شاشة إن درايف التلقائية (Accessibility Service)**: يقرأ الرحلات والكيلومترات والأجرة فور ظهورها على الشاشة!
          - 🟢 شريط عائم ذكي (HUD) يعرض صافي الربح واقتراح أفضل سعر للمزايدة تلقائياً دون كتابة يدوي.
          - ⛽ حاسبة تكاليف البنزين واستهلاك الزيت لسيارات مصر.
          
          **التحميل المباشر:** حمل ملف `inDrive-Assistant.apk` المرفق بالأسفل وثبته على هاتفك مباشرة.
        files: inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inDrive-Assistant-Debug-APK
        path: inDrive-Assistant.apk
