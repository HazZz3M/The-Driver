name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Ensure Permanent Signing Keystore
      run: |
        mkdir -p android/app/keystore
        if [ ! -f android/app/keystore/fixed-release.keystore ]; then
          keytool -genkey -v -keystore android/app/keystore/fixed-release.keystore -alias thedriver -keyalg RSA -keysize 2048 -validity 10000 -storepass thedriver123 -keypass thedriver123 -dname "CN=TheDriver, OU=Mobile, O=TheDriver, L=Cairo, ST=Cairo, C=EG"
        fi

    - name: Fix Line Endings and Permissions
      run: |
        if [ -f ./android/gradlew ]; then
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew
        fi

    - name: Install Flutter Dependencies
      run: |
        flutter --version
        flutter pub get

    - name: Build Flutter Debug APK
      run: |
        flutter --version
        echo "Building Flutter debug APK..."
        flutter build apk --debug --android-skip-build-dependency-validation
        cp build/app/outputs/flutter-apk/app-debug.apk The-Driver.apk
        cp build/app/outputs/flutter-apk/app-debug.apk inDrive-Assistant.apk
        ls -lh The-Driver.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@The-Driver.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click Here to Download The Driver APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.9.0
        name: "The Driver v1.9.0 - Multi-Card Feed Popups, In-App Direct APK Downloader & Full-Screen Distance Fix"
        body: |
          ### The Driver v1.8.0 - Full-Screen Map Marker & Ergonomic UX Release
          - **Full-Screen Ride Details Scanner**: Specifically identifies full-screen "Ride request" screens and extracts Point A marker distance (pickup) and Point B marker distance (trip) directly from the map pins and bottom sheet.
          - **Dismiss on Outside Tap**: Tapping anywhere outside the expanded details popup instantly collapses it back into a floating badge.
          - **Strict Single-Expanded Policy**: Only one popup hint can be opened at a time. Opening another popup automatically closes the previous one.
          - **Vertical Text & Split Elimination**: Converted compact circular badges and speedo gauges to single-line horizontal text (e.g., `75 ج` instead of vertical stacking).
          - **Side-by-Side Fare Comparison**: Restructured the expanded card with spacious side-by-side metric boxes and dedicated profit and distance rows to prevent word wrapping.
        files: |
          The-Driver.apk
          inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Driver-Debug-APK
        path: The-Driver.apk
