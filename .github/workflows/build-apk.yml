name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Ensure Permanent Signing Keystore
      run: |
        mkdir -p android/app/keystore
        if [ ! -f android/app/keystore/fixed-release.keystore ]; then
          keytool -genkey -v -keystore android/app/keystore/fixed-release.keystore -alias thedriver -keyalg RSA -keysize 2048 -validity 10000 -storepass thedriver123 -keypass thedriver123 -dname "CN=TheDriver, OU=Mobile, O=TheDriver, L=Cairo, ST=Cairo, C=EG"
        fi

    - name: Fix Line Endings and Permissions
      run: |
        if [ -f ./android/gradlew ]; then
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew
        fi

    - name: Install Flutter Dependencies
      run: |
        flutter --version
        flutter pub get

    - name: Build Flutter Debug APK
      run: |
        flutter --version
        echo "Building Flutter debug APK..."
        flutter build apk --debug --android-skip-build-dependency-validation
        cp build/app/outputs/flutter-apk/app-debug.apk The-Driver.apk
        cp build/app/outputs/flutter-apk/app-debug.apk inDrive-Assistant.apk
        ls -lh The-Driver.apk

    - name: Upload to Litterbox (Direct Mobile Download)
      id: litterbox
      run: |
        DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@The-Driver.apk" https://litterbox.catbox.moe/resources/internals/api.php)
        echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
        echo "### Direct APK Mobile Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click Here to Download The Driver APK directly to phone]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "Direct Link: $DIRECT_URL"

    - name: Create GitHub Release with direct APK file
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.7.0
        name: "The Driver v1.7.0 - Precision Distance Extraction & 60fps Performance Overhaul"
        body: |
          ### The Driver v1.7.0 - Precision Distance & Performance Release
          - **Dynamic Ride Distance Parser**: Solved the fixed 3.2 km / (1 وصول + 1 مشوار) bug! Now dynamically extracts true individual pickup and trip distances across all Arabic & English formats.
          - **Meters & RTL Reversal Support**: Accurately parses meter distances (e.g., `600 م` -> `0.6 كم`), Arabic decimal separators (`٫`), and RTL unit inversion (`كم 3.5`).
          - **Spatial Card Container Isolation**: Prevents Compose LazyColumn root container leaking text between stacked order cards.
          - **Fractional HUD Precision**: Displays exact fractional kilometer breakdowns (`1.8 وصول + 7.4 مشوار`) instead of truncated integers.
          - **60fps Lag-Free Navigation**: Added in-memory cached database layer, eliminating synchronous JSON deserialization on UI thread during page changes and slider drags.
          - **Lazy Tab Instantiation**: Tabs are loaded on-demand, drastically reducing initial memory footprint and stutter.
          - **Executive Obsidian & Emerald Cockpit Theme**: Shifted away from harsh neon to an ergonomic, anti-glare automotive palette (`#0B0F19` Obsidian with `#10B981` Precision Emerald).
        files: |
          The-Driver.apk
          inDrive-Assistant.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Driver-Debug-APK
        path: The-Driver.apk
