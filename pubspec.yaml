name: indrive_assistant
description: "Smart Driver Companion, Fare Optimizer & Floating HUD for inDrive Drivers."
publish_to: 'none'
version: 1.17.0+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Persistent Storage
  shared_preferences: ^2.3.2

  # Utilities & Networking
  intl: any
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
